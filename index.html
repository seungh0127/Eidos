<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF" />
<meta name="color-scheme" content="light" />
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Eidos</title>
<link rel="icon" type="image/png" href="assets/favicon.png?v=2">
<link rel="apple-touch-icon" href="assets/favicon.png?v=2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<link rel="stylesheet" href="styles/common.css">
<link rel="stylesheet" href="styles/main.css">
</head>
<body>

<div class="sa-bg sa-bg-top" aria-hidden="true"></div>
<div class="sa-bg sa-bg-bottom" aria-hidden="true"></div>

<nav id="main-nav" aria-label="Main navigation">
  <a class="nav-link" href="about/">About</a>
  <a class="nav-link" href="possibilities/">Possibilities</a>
</nav>

<div id="menu-wrap">
  <button id="menu-btn" type="button" aria-label="Open category menu" aria-expanded="false">
    <span class="menu-line menu-line-1"></span>
    <span class="menu-line menu-line-2"></span>
    <span class="menu-line menu-line-3"></span>
  </button>
  <nav id="category-menu" aria-label="Module categories">
    <a class="category-link active" data-category="ALL" href="#">ALL</a>
    <a class="category-link" data-category="Head" href="#">Head</a>
    <a class="category-link" data-category="Core" href="#">Core</a>
    <a class="category-link" data-category="CoreExtension" href="#">Core Extension</a>
    <a class="category-link" data-category="Shoulder" href="#">Shoulder</a>
    <a class="category-link" data-category="UpperArm" href="#">Upper arm</a>
    <a class="category-link" data-category="Forearm" href="#">Forearm</a>
    <a class="category-link" data-category="EndEffector" href="#">End-effector</a>
    <a class="category-link" data-category="Locomotion" href="#">Locomotion</a>
    <a class="category-link" data-category="Extension" href="#">Extension</a>
  </nav>
</div>

<div id="viewport">
  <div id="world"></div>
</div>

<div id="hover-label" aria-hidden="true"></div>

<div id="logo-btn" aria-label="Reset camera">
  <img src="assets/Logo1.svg" alt="Eidos">
</div>


<div id="mod-overlay" role="dialog" aria-modal="true" aria-hidden="true">
  <div id="mod-overlay-bg" aria-hidden="true"></div>
  <div id="mod-overlay-glow" aria-hidden="true"></div>
  <div id="mod-overlay-content">
    <div id="mod-detail-header">
      <span class="mod-detail-bar" aria-hidden="true"></span>
      <div class="mod-detail-code-block">
        <span id="mod-detail-compact"></span>
        <div class="mod-detail-meta">
          <span id="mod-detail-prdt-line"></span>
          <span id="mod-detail-name-line"></span>
        </div>
      </div>
    </div>
    <h2 id="mod-detail-title"></h2>
    <video id="mod-detail-video" muted loop playsinline></video>
    <button id="mod-nav-prev" class="mod-nav-btn" type="button" aria-label="Previous module">
      <img src="assets/back_icon.svg" alt="" draggable="false">
    </button>
    <button id="mod-nav-next" class="mod-nav-btn" type="button" aria-label="Next module">
      <img src="assets/next_icon.svg" alt="" draggable="false">
    </button>
  </div>
</div>

<script src="scripts/color-curve.js"></script>
<script src="scripts/main.js"></script>
</body>
</html>
