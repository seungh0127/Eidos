<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF" />
<meta name="color-scheme" content="light" />
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Eidos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<link rel="stylesheet" href="styles/common.css">
<link rel="stylesheet" href="styles/main.css">
</head>
<body>

<div class="sa-bg sa-bg-top" aria-hidden="true"></div>
<div class="sa-bg sa-bg-bottom" aria-hidden="true"></div>

<nav id="main-nav" aria-label="Main navigation">
  <a class="nav-link" href="about/">About</a>
  <a class="nav-link" href="possibilities/">Possibilities</a>
</nav>

<div id="viewport">
  <div id="world"></div>
</div>

<div id="hover-label" aria-hidden="true"></div>

<div id="logo-btn" aria-label="Reset camera">
  <img src="assets/Logo.svg" alt="Eidos">
</div>

<button id="gyro-toggle" aria-label="Toggle gyroscope">ON</button>

<div id="gyro-overlay">
  <div class="motion-dialog-wrapper">
    <div
      class="motion-dialog"
      role="dialog"
      aria-modal="true"
      aria-labelledby="motion-dialog-title"
      aria-describedby="motion-dialog-description"
    >
      <h2 id="motion-dialog-title" class="motion-dialog-title">
        Tilt your device<br>
        to explore
      </h2>
      <p id="motion-dialog-description" class="motion-dialog-description">
        기기를 기울여 다양한 로봇 모듈을<br>
        탐색해 보세요
      </p>
      <button
        id="enable-motion-btn"
        type="button"
        class="motion-dialog-button"
        aria-label="Enable device motion"
      >
        <span class="motion-dialog-button-label">Enable<br>Motion</span>
      </button>
    </div>
  </div>
</div>

<div id="mod-overlay" role="dialog" aria-modal="true" aria-hidden="true">
  <div id="mod-overlay-bg" aria-hidden="true"></div>
  <div id="mod-overlay-glow" aria-hidden="true"></div>
  <div id="mod-overlay-content">
    <div id="mod-detail-header">
      <span class="mod-detail-bar" aria-hidden="true"></span>
      <div class="mod-detail-code-block">
        <span id="mod-detail-compact"></span>
        <div class="mod-detail-meta">
          <span id="mod-detail-prdt-line"></span>
          <span id="mod-detail-name-line"></span>
        </div>
      </div>
    </div>
    <h2 id="mod-detail-title"></h2>
    <img id="mod-detail-img" src="" alt="">
  </div>
</div>

<script src="scripts/main.js"></script>
</body>
</html>
